# =============================================================================
# NGINX reverse proxy for alice.deviousweb.com
# =============================================================================
#
# Architecture:
#   - Frontend (static, `serve` CLI) ..... http://127.0.0.1:3000
#   - Backend  (Node/Express + Socket.IO)  http://127.0.0.1:5000
#       * REST routes mounted WITHOUT /api prefix (e.g. /auth/login).
#         NGINX strips the /api/ prefix before proxying.
#       * Socket.IO lives at /socket.io (verbatim, no strip).
#   - TLS terminates at NGINX (Let's Encrypt via certbot).
#
# Installation:
#   sudo cp alice.conf /etc/nginx/sites-available/alice.conf
#   sudo ln -s /etc/nginx/sites-available/alice.conf /etc/nginx/sites-enabled/alice.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Obtain a certificate (pick ONE):
#   # Option A: certbot's nginx plugin (it will edit this file in place)
#   sudo certbot --nginx -d alice.deviousweb.com
#
#   # Option B: webroot (matches the ACME challenge block below)
#   sudo mkdir -p /var/www/letsencrypt
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d alice.deviousweb.com
#
# Renewals are handled automatically by the certbot systemd timer.
# =============================================================================

# -----------------------------------------------------------------------------
# Port 80: ACME challenge + redirect everything else to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name alice.deviousweb.com;

    # Let's Encrypt HTTP-01 challenge.
    # Webroot convention: /var/www/letsencrypt (must exist and be readable by nginx).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Port 443: TLS + reverse proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alice.deviousweb.com;

    # ----- Logging -----------------------------------------------------------
    access_log /var/log/nginx/alice.access.log;
    error_log  /var/log/nginx/alice.error.log warn;

    # ----- TLS certificates (Let's Encrypt) ----------------------------------
    ssl_certificate     /etc/letsencrypt/live/alice.deviousweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alice.deviousweb.com/privkey.pem;

    # ----- Modern TLS (Mozilla "intermediate", 2024-ish) ---------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ----- Security headers --------------------------------------------------
    # HSTS: leave commented until you're 100% sure about the domain & subdomains.
    # Once enabled (and especially with `preload`), browsers will refuse plain HTTP
    # for two years. Do NOT uncomment unless you're committed.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # App uses mic for voice input, so allow self. No geo, no camera.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # ----- Request limits ----------------------------------------------------
    # App allows up to 20MB image uploads via Socket.IO; 25m gives us a margin.
    client_max_body_size 25m;

    # =========================================================================
    # /api/  ->  Node backend (strip /api/ prefix)
    # =========================================================================
    # The trailing slash on BOTH sides is what triggers the strip:
    #   /api/auth/login  ->  http://127.0.0.1:5000/auth/login
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # LLM streaming endpoints can take minutes; disable buffering so chunks
        # flow to the client as they arrive.
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =========================================================================
    # /socket.io/  ->  Node backend (verbatim path, WebSocket upgrade)
    # =========================================================================
    # NO trailing slash on proxy_pass -> path is forwarded exactly as received.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Socket.IO pings every 25s, but agent "thinking" phases can be silent
        # for minutes. Generous timeouts prevent premature disconnects.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering    off;
    }

    # =========================================================================
    # /  ->  Static frontend (`serve` on :3000)
    # =========================================================================
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
