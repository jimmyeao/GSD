[mqtt]
# MQTT broker address
broker = your-mqtt-broker.local

# MQTT broker port (default: 1883 for unencrypted, 8883 for TLS)
port = 1883

# Optional: MQTT username (if authentication required)
username = 

# Optional: MQTT password (if authentication required)
password = 

# Client ID for this application
client_id = reminder_app

# Base topic for reminders
base_topic = reminder

[app]
# Window dimensions
window_width = 500
window_height = 600
